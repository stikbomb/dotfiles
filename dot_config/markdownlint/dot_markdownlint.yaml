# Глобальные правила markdownlint для заметок/доков.
# Используется nvim (nva) когда у проекта нет своего конфига.

# Длина строки — не для прозы
MD013: false
# Стиль колонок таблицы (выравнивание пайпов) — руками не выровнять
MD060: false
# Инлайновый HTML — норма в Obsidian
MD033: false
# Первая строка не обязана быть заголовком (frontmatter, ADR-шапки)
MD041: false
# Голые URL
MD034: false
# **Жирный** как псевдо-заголовок
MD036: false
# Повторяющиеся заголовки допустимы в разных секциях
MD024:
  siblings_only: true
# Нумерация списков: 1. 1. 1. или 1. 2. 3. — обе ок
MD029:
  style: one_or_ordered
